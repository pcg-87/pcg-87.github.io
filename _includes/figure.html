<figure class="fig">
  <a href="{{ include.src | relative_url }}" class="fig__link">
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt }}"
         {% if include.width %}width="{{ include.width }}"{% endif %} loading="lazy" decoding="async">
  </a>
  {%- if include.caption %}
  <figcaption>{{ include.caption | markdownify | remove: '<p>' | remove: '</p>' }}</figcaption>
  {%- endif %}
</figure>
