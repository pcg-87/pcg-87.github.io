---
layout: default
---
<div class="prose">
  <h1>Tagged &ldquo;{{ page.tag }}&rdquo;</h1>
  <p class="meta">{{ page.posts | size }} writeup{% if page.posts.size != 1 %}s{% endif %}</p>

  <ul class="post-list">
    {%- for post in page.posts %}
    <li>
      <a class="post-list__title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      {% include post-meta.html post=post %}
    </li>
    {%- endfor %}
  </ul>

  <p><a href="{{ '/tags/' | relative_url }}">&larr; All tags</a></p>
</div>
