---
layout: default
---
<article class="prose" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post-head">
    <h1 itemprop="name headline">{{ page.title }}</h1>
    {% include post-meta.html post=page %}
  </header>

  <div itemprop="articleBody">
    {{ content }}
  </div>

  <nav class="post-nav">
    {%- if page.previous %}
    <a class="post-nav__prev" href="{{ page.previous.url | relative_url }}">
      <span>Previous</span>{{ page.previous.title }}
    </a>
    {%- endif %}
    {%- if page.next %}
    <a class="post-nav__next" href="{{ page.next.url | relative_url }}">
      <span>Next</span>{{ page.next.title }}
    </a>
    {%- endif %}
  </nav>
</article>
